# Chef page (guest preview, visibility, identity edit). See docs/features/cook-profile.md
# and docs/features/profile-pictures.md.

fragment ProfileCookChefProfileCook on Cook {
    cookId
    pathName
    previousPathNames
    stageName
    isVisible
    isApprovedByAdmin
    canCreateOffers
    biography
    biographySummary
    biographySummaryGenerating
    cuisineStyle
    cookingPhilosophy
    defaultOfferMessage
    logo {
        url
    }
    rating {
        averageRating
        reviewCount
    }
    exactTravelOriginAddress {
        city
    }
    meals {
        mealId
        title
        description
        imageUrl
        publishedAt
    }
    menus {
        menuId
        title
        description
        publishedAt
        courseMealOptionImages
        courses {
            courseId
            title
            mealOptions {
                mealId
                title
                description
                imageUrl
            }
        }
    }
    presenceLinks {
        websiteUrl
        instagramUrl
        googleProfileUrl
        takeAChefUrl
        otherProfiles {
            platform
            label
            url
        }
    }
}

fragment ProfileCookChefProfileUser on User {
    userId
    firstName
    lastName
    profilePicture {
        fileUploadId
        url
    }
    cook {
        ...ProfileCookChefProfileCook
    }
}

query ProfileCookChefProfilePage {
    currentSession {
        sessionId
        user {
            ...ProfileCookChefProfileUser
        }
    }
}

subscription ProfileCookChefProfilePageUpdates {
    userUpdates {
        ...ProfileCookChefProfileUser
    }
}

mutation ProfileCookUpdate($input: CookUpdate!) {
    user {
        cook {
            update(input: $input) {
                success
                referenceId
            }
        }
    }
}

mutation ProfileCookPresenceLinksReplace($input: CookPresenceLinksUpdate!) {
    user {
        cook {
            presenceLinksReplace(input: $input) {
                success
                referenceId
            }
        }
    }
}

mutation ProfileCookBiographySuggest($currentBiography: String!) {
    user {
        cook {
            biographySuggest(currentBiography: $currentBiography)
        }
    }
}

mutation ProfileCookChefProfileUserUpdate($user: UserUpdate!) {
    user {
        userUpdate(user: $user) {
            success
        }
    }
}
