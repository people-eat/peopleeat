# Cook offer detail. Loaded by `/profile/booking-request-offers/$bookingRequestOfferId`.

fragment ProfileCookBookingRequestOfferPageUser on User {
    userId
    cook {
        cookId
        callSchedulingEnabled
        callDurationMinutes
        meals {
            mealId
            title
            description
            imageUrl
        }
        menus {
            menuId
            title
            description
            courses {
                courseId
            }
        }
        bookingRequestOffer(bookingRequestOfferId: $bookingRequestOfferId) {
            bookingRequestOfferId
            status
            cookAccepted
            userAccepted
            cookUnreadNotificationCount
            cookDeclinationReason
            userDeclinationReason
            menuPriceCents
            travelDistanceKm
            travelExpensesCents
            totalWithoutDiscountsCentsCustomer
            payoutCentsCook
            priceAutoAdjustReason
            configuredMenu {
                title
                description
                courses {
                    title
                    meals {
                        mealTitle
                        mealDescription
                        mealImageUrl
                    }
                }
            }
            suggestedMenus {
                menuId
                title
                description
                copyOfMenuId
                courseMealOptionImages
                courses {
                    courseId
                }
            }
            cookTestimonial {
                cookTestimonialId
                body
                rating
            }
            testimonialMissing
            preparationsCompletedAt
            canCompletePreparations
            participantAmendment {
                requestedAt
                participants {
                    type
                    name
                    restrictions
                }
                exactEventAddress {
                    displayText
                    city
                }
                menuPriceCentsBefore
                menuPriceCentsAfter
                travelExpensesCentsBefore
                travelExpensesCentsAfter
                totalCentsCustomerBefore
                totalCentsCustomerAfter
                payoutCentsCookBefore
                payoutCentsCookAfter
                giftCardDeltaCents
            }
            costBreakdown {
                total {
                    title
                    amountCents
                }
            }
            callBookings {
                cookCallSlotBookingId
                cookId
                userId
                bookingRequestOfferId
                startAt
                endAt
                status
                initiator
                customerMessage
                cookMessage
                declineReason
                canceledBy
                canceledReason
                videoCallRoomId
                createdAt
                lastModifiedAt
            }
            activeCallRoom {
                bookingRequestOfferCallRoomId
                bookingRequestOfferId
                livekitRoomName
                status
                createdByUserId
                startedAt
                endedAt
            }
            bookingRequest {
                bookingRequestId
                status
                occasion
                dateTime
                preferences
                priceClassType
                suggestedOfferAmountCents
                minOfferAmountCents
                maxOfferAmountCents
                minOfferAmountHardCents
                exactEventAddress {
                    displayText
                    addressLine1
                    addressLine2
                    city
                    postCode
                    state
                    country
                }
                invoiceAddress {
                    companyName
                    firstName
                    lastName
                    country
                    city
                    postalCode
                    line1
                    line2
                }
                participants {
                    bookingRequestParticipantId
                    type
                    name
                    restrictions
                }
                user {
                    display
                    profilePicture {
                        url
                    }
                }
            }
            messages {
                ...HumanChatMessageFields
            }
        }
    }
}

query ProfileCookBookingRequestOfferPage($bookingRequestOfferId: ID!) {
    currentSession {
        user {
            ...ProfileCookBookingRequestOfferPageUser
        }
    }
}

subscription ProfileCookBookingRequestOfferPageUpdates($bookingRequestOfferId: ID!) {
    userUpdates {
        ...ProfileCookBookingRequestOfferPageUser
    }
}

mutation ProfileCookBookingRequestOfferAccept($bookingRequestOfferId: ID!) {
    user {
        cook {
            bookingRequestOfferAccept(bookingRequestOfferId: $bookingRequestOfferId) {
                success
                referenceId
            }
        }
    }
}

