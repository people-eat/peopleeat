# Wallet / Stripe Connect. Return/refresh land here with search params.
# Invoice address collection lives here too (Getting started → Wallet).
# See docs/features/cook-profile.md.

fragment ProfileWalletInvoiceAddress on InvoiceAddress {
    companyName
    firstName
    lastName
    country
    city
    postalCode
    line1
    line2
}

fragment ProfileWalletTravelOrigin on CookTravelOriginAddress {
    displayText
    addressLine1
    addressLine2
    city
    postCode
    country
}

fragment ProfileWalletCook on Cook {
    cookId
    isApprovedByAdmin
    stripeStatus
    canCreateOffers
    exactTravelOriginAddress {
        ...ProfileWalletTravelOrigin
    }
    invoiceAddress {
        ...ProfileWalletInvoiceAddress
    }
}

fragment ProfileWalletStripeAccountDetails on CookStripeAccountDetails {
    detailsSubmitted
    chargesEnabled
    payoutsEnabled
    disabledReason
    currentlyDue
    pastDue
    pendingVerification
}

fragment ProfileWalletStripeWallet on CookStripeWallet {
    availableCents
    pendingCents
    transactions {
        balanceTransactionId
        kind
        status
        netCents
        createdAt
        availableOn
        description
    }
}

fragment ProfileWalletUser on User {
    userId
    firstName
    lastName
    cook {
        ...ProfileWalletCook
    }
}

query ProfileCookWalletPage {
    currentSession {
        sessionId
        user {
            ...ProfileWalletUser
            cook {
                stripeAccountDetails {
                    ...ProfileWalletStripeAccountDetails
                }
                stripeWallet {
                    ...ProfileWalletStripeWallet
                }
            }
        }
    }
}

# Live Stripe snapshots only — refetch after sync without putting Stripe on userUpdates.
query ProfileCookWalletStripeDetails {
    currentSession {
        user {
            cook {
                stripeAccountDetails {
                    ...ProfileWalletStripeAccountDetails
                }
                stripeWallet {
                    ...ProfileWalletStripeWallet
                }
            }
        }
    }
}

subscription ProfileCookWalletPageUpdates {
    userUpdates {
        ...ProfileWalletUser
    }
}

query ProfileCookWalletLocationSuggestions($searchText: String!, $onlyFullAddresses: Boolean! = true) {
    currentSession {
        locationSuggestions(searchText: $searchText, onlyFullAddresses: $onlyFullAddresses) {
            displayText
            latitude
            longitude
            structuredAddress {
                ...ProfileWalletTravelOrigin
                latitude
                longitude
                state
            }
        }
    }
}

mutation ProfileCookStripeOnboardingStart($returnUrl: String!, $refreshUrl: String!) {
    user {
        cook {
            stripeOnboardingStart(returnUrl: $returnUrl, refreshUrl: $refreshUrl) {
                kind
                url
            }
        }
    }
}

mutation ProfileCookStripeStatusSync {
    user {
        cook {
            stripeStatusSync {
                success
                referenceId
            }
        }
    }
}

mutation ProfileCookStripeDashboardUrlCreate {
    user {
        cook {
            stripeDashboardUrlCreate {
                url
            }
        }
    }
}

mutation ProfileCookWalletInvoiceAddressUpdate($input: CookUpdate!) {
    user {
        cook {
            update(input: $input) {
                success
                referenceId
            }
        }
    }
}
