# Finances / Stripe Connect. Return/refresh land here with search params.
# Invoice address collection lives here too (Getting started → Finances).
# See docs/features/cook-profile.md.

fragment ProfileFinancesInvoiceAddress on InvoiceAddress {
    companyName
    firstName
    lastName
    country
    city
    postalCode
    line1
    line2
}

fragment ProfileFinancesTravelOrigin on CookTravelOriginAddress {
    displayText
    addressLine1
    addressLine2
    city
    postCode
    country
}

fragment ProfileFinancesCook on Cook {
    cookId
    isApprovedByAdmin
    stripeStatus
    canCreateOffers
    exactTravelOriginAddress {
        ...ProfileFinancesTravelOrigin
    }
    invoiceAddress {
        ...ProfileFinancesInvoiceAddress
    }
}

fragment ProfileFinancesStripeAccountDetails on CookStripeAccountDetails {
    detailsSubmitted
    chargesEnabled
    payoutsEnabled
    disabledReason
    currentlyDue
    pastDue
    pendingVerification
}

fragment ProfileFinancesStripeWallet on CookStripeWallet {
    availableCents
    pendingCents
    transactions {
        balanceTransactionId
        kind
        status
        netCents
        createdAt
        availableOn
        description
    }
}

fragment ProfileFinancesUser on User {
    userId
    firstName
    lastName
    cook {
        ...ProfileFinancesCook
    }
}

query ProfileCookFinancesPage {
    currentSession {
        sessionId
        user {
            ...ProfileFinancesUser
            cook {
                stripeAccountDetails {
                    ...ProfileFinancesStripeAccountDetails
                }
                stripeWallet {
                    ...ProfileFinancesStripeWallet
                }
            }
        }
    }
}

# Live Stripe snapshots only — refetch after sync without putting Stripe on userUpdates.
query ProfileCookFinancesStripeDetails {
    currentSession {
        user {
            cook {
                stripeAccountDetails {
                    ...ProfileFinancesStripeAccountDetails
                }
                stripeWallet {
                    ...ProfileFinancesStripeWallet
                }
            }
        }
    }
}

subscription ProfileCookFinancesPageUpdates {
    userUpdates {
        ...ProfileFinancesUser
    }
}

query ProfileCookFinancesLocationSuggestions($searchText: String!, $onlyFullAddresses: Boolean! = true) {
    currentSession {
        locationSuggestions(searchText: $searchText, onlyFullAddresses: $onlyFullAddresses) {
            displayText
            latitude
            longitude
            structuredAddress {
                ...ProfileFinancesTravelOrigin
                latitude
                longitude
                state
            }
        }
    }
}

mutation ProfileCookStripeOnboardingStart($returnUrl: String!, $refreshUrl: String!) {
    user {
        cook {
            stripeOnboardingStart(returnUrl: $returnUrl, refreshUrl: $refreshUrl) {
                kind
                url
            }
        }
    }
}

mutation ProfileCookStripeStatusSync {
    user {
        cook {
            stripeStatusSync {
                success
                referenceId
            }
        }
    }
}

mutation ProfileCookStripeDashboardUrlCreate {
    user {
        cook {
            stripeDashboardUrlCreate {
                url
            }
        }
    }
}

mutation ProfileCookFinancesInvoiceAddressUpdate($input: CookUpdate!) {
    user {
        cook {
            update(input: $input) {
                success
                referenceId
            }
        }
    }
}
