query ProfileCustomerBookingRequestEditLocationSuggestions($searchText: String!, $onlyFullAddresses: Boolean! = true) {
    currentSession {
        locationSuggestions(searchText: $searchText, onlyFullAddresses: $onlyFullAddresses) {
            displayText
            latitude
            longitude
            structuredAddress {
                displayText
                latitude
                longitude
                addressLine1
                addressLine2
                city
                postCode
                state
                country
            }
        }
    }
}

query ProfileCustomerBookingRequestEditTravelImpact($bookingRequestId: ID!, $exactEventAddress: UserBookingRequestExactEventAddressInput!) {
    currentSession {
        user {
            bookingRequest(bookingRequestId: $bookingRequestId) {
                bookingRequestId
                travelImpact(exactEventAddress: $exactEventAddress) {
                    bookingRequestOfferId
                    cookDisplay
                    travelDistanceKmBefore
                    travelDistanceKmAfter
                    travelExpensesCentsBefore
                    travelExpensesCentsAfter
                }
            }
        }
    }
}
