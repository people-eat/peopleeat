            courseSelections: $courseSelections
        ) {
            success
            referenceId
        }
    }
}

mutation ProfileCustomerBookingRequestOfferChatMessageCreate($bookingRequestOfferId: ID!, $message: String!, $fileUploadIds: [ID!]) {
    user {
        bookingRequestOfferChatMessageCreate(
            bookingRequestOfferId: $bookingRequestOfferId
            message: $message
            fileUploadIds: $fileUploadIds
        ) {
            success
            referenceId
        }
    }
}

mutation ProfileCustomerBookingRequestOfferChatMessageReactionUpsert($bookingRequestOfferEventId: ID!, $emoji: String!) {
    user {
        bookingRequestOfferChatMessageReactionUpsert(bookingRequestOfferEventId: $bookingRequestOfferEventId, emoji: $emoji) {
            success
            referenceId
        }
    }
}

mutation ProfileCustomerBookingRequestOfferUnreadNotificationCountReset($bookingRequestOfferId: ID!) {
    user {
        bookingRequestOfferUnreadNotificationCountReset(bookingRequestOfferId: $bookingRequestOfferId) {
            success
            referenceId
        }
    }
}

mutation ProfileCustomerBookingRequestOfferCallSlotRequest($bookingRequestOfferId: ID!, $startAt: DateTime!, $customerMessage: String) {
    user {
        bookingRequestOfferCallSlotRequest(
            bookingRequestOfferId: $bookingRequestOfferId
            startAt: $startAt
            customerMessage: $customerMessage
        ) {
            success
            referenceId
        }
    }
}

mutation ProfileCustomerBookingRequestOfferCallSlotConfirm($cookCallSlotBookingId: ID!) {
    user {
        bookingRequestOfferCallSlotConfirm(cookCallSlotBookingId: $cookCallSlotBookingId) {
