        }
    }
}

mutation ProfileCustomerBookingRequestOfferCallSlotCancel($cookCallSlotBookingId: ID!, $reason: String) {
    user {
        bookingRequestOfferCallSlotCancel(cookCallSlotBookingId: $cookCallSlotBookingId, reason: $reason) {
            success
            referenceId
        }
    }
}

mutation ProfileCustomerBookingRequestOfferCallCreate($bookingRequestOfferId: ID!) {
    user {
        bookingRequestOfferCallCreate(bookingRequestOfferId: $bookingRequestOfferId) {
            token
            url
            bookingRequestOfferCallRoomParticipantId
        }
    }
}

mutation ProfileCustomerBookingRequestOfferCallJoin($bookingRequestOfferId: ID!) {
    user {
        bookingRequestOfferCallJoin(bookingRequestOfferId: $bookingRequestOfferId) {
            token
            url
            bookingRequestOfferCallRoomParticipantId
        }
    }
}

mutation ProfileCustomerBookingRequestOfferCallLeave($bookingRequestOfferCallRoomParticipantId: ID!) {
    user {
        bookingRequestOfferCallLeave(bookingRequestOfferCallRoomParticipantId: $bookingRequestOfferCallRoomParticipantId) {
            success
            referenceId
        }
    }
}
