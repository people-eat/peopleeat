mutation ProfileCustomerBookingRequestOfferCallSlotDecline($cookCallSlotBookingId: ID!, $reason: String) {
    user {
        bookingRequestOfferCallSlotDecline(cookCallSlotBookingId: $cookCallSlotBookingId, reason: $reason) {
            success
