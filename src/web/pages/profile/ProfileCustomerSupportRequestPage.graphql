# Customer support chat detail. See docs/features/support-requests.md.

fragment ProfileCustomerSupportRequestPageUser on User {
    userId
    supportRequest(supportRequestId: $supportRequestId) {
        supportRequestId
        subject
        status
        userUnreadNotificationCount
        createdAt
        resolvedAt
        bookingRequest {
            bookingRequestId
            occasion
            dateTime
        }
        messages {
            ... on ChatMessageUser {
                __typename
                chatMessageId
                body
                isOwn
                showCopyButton
                collapseLongBody
                createdAt
                author {
                    display
                    createdAt
                    profilePicture {
                        url
                    }
                }
                attachments {
                    fileUploadId
                    filename
                    mediaType
                    size
                    url
                }
            }
        }
    }
}

query ProfileCustomerSupportRequestPage($supportRequestId: ID!) {
    currentSession {
        user {
            ...ProfileCustomerSupportRequestPageUser
        }
    }
}

subscription ProfileCustomerSupportRequestPageUpdates($supportRequestId: ID!) {
    userUpdates {
        ...ProfileCustomerSupportRequestPageUser
    }
}

mutation ProfileSupportRequestMessageCreate($supportRequestId: ID!, $message: String!, $fileUploadIds: [ID!]) {
    user {
        supportRequestMessageCreate(supportRequestId: $supportRequestId, message: $message, fileUploadIds: $fileUploadIds) {
            success
            referenceId
        }
    }
}

mutation ProfileSupportRequestUnreadNotificationCountReset($supportRequestId: ID!) {
    user {
        supportRequestUnreadNotificationCountReset(supportRequestId: $supportRequestId) {
            success
            referenceId
        }
    }
}
