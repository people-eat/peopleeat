# Profile gate — unsigned sessions redirect in the route loader. Nullable
# `User.cook` picks cook vs customer UI (same presence-probe pattern as
# `User.admin`). Server-derived `attention` / `onboardingSteps` drive the
# overview to-dos (wording in `src/shared/attentionCopy.ts`); `bookingRequests`
# drive the customer Next dinner card. Sidebar badge counts live on
# `CookSidebarNavBadges` (see CookSidebar.graphql) and `CustomerSidebarNavBadges`
# (see CustomerSidebar.graphql). Seed-and-subscribe via `userUpdates`.
# See docs/architecture/attention.md, docs/architecture/state-synchronization.md,
# `docs/features/profile.md`, `docs/features/cook-shell.md`, and
# `docs/features/customer-shell.md`.

fragment ProfilePageCookStatus on Cook {
    cookId
    attention {
        kind
        count
        bookingRequestOfferId
        callStartAt
        customerDisplay
    }
    onboardingSteps
    analytics(period: PAST_MONTH) {
        hasInsights
        publicProfileViewCount
        medianNotifyToOpenMinutes
        offersCreatedCount
        offerConversionRate
    }
    ...CookSidebarNavBadges
}

fragment ProfilePageUser on User {
    userId
    status
    firstName
    lastName
    cook {
        ...ProfilePageCookStatus
    }
    admin {
        adminId
    }
    bookingRequests {
        bookingRequestId
        status
        occasion
        dateTime
        exactEventAddress {
            displayText
            city
        }
        participants {
            bookingRequestParticipantId
            type
        }
        offers {
            bookingRequestOfferId
            status
            userUnreadNotificationCount
            testimonialMissing
            cook {
                cookId
                user {
                    display
                    profilePicture {
                        url
                    }
                }
            }
            callBookings {
                cookCallSlotBookingId
                startAt
                endAt
                status
                initiator
            }
        }
    }
    attention {
        kind
        count
        bookingRequestId
        bookingRequestOfferId
        occasion
        callStartAt
        callEndAt
    }
    ...CustomerSidebarNavBadges
}

query ProfilePage {
    currentSession {
        sessionId
        activeFeatureToggleKeys
        user {
            ...ProfilePageUser
        }
    }
    publicWebPage {
        findOne(webPageKey: PROFILE) {
            titleDe
            titleEn
            descriptionDe
            descriptionEn
        }
    }
}

subscription ProfilePageUpdates {
    userUpdates {
        ...ProfilePageUser
    }
}

# Lean status probe for the shell restriction banner (seeded from ProfilePage).
subscription ProfileBanStatusUpdates {
    userUpdates {
        userId
        status
    }
}
