query ChefPage($pathName: String!) {
    currentSession {
        activeFeatureToggleKeys
        user {
            ...PublicHeaderUser
        }
    }
    publicCook {
        findOneByPathName(pathName: $pathName) {
            cookId
            pathName
            biography
            biographySummary
            logo {
                url
            }
            cuisineStyle
            cookingPhilosophy
            city
            cityPage {
                pathName
                nameDe
                nameEn
            }
            minimumPriceAmount
            maximumPriceAmount
            minimumParticipants
            maximumParticipants
            callSchedulingEnabled
            user {
                display
                profilePicture {
                    url
                }
            }
            meals {
                mealId
                title
                description
                imageUrl
            }
            testimonials {
                ...CustomerTestimonialCardFields
            }
            rating {
                averageRating
                reviewCount
            }
            canReceiveDirectRequests
        }
    }
}
