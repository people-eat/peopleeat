query ChefPage($pathName: String!, $includeLastVisitedCookProfiles: Boolean!, $excludeLastVisitedCookId: ID) {
    currentSession {
        activeFeatureToggleKeys
        lastVisitedCookProfiles(excludeCookId: $excludeLastVisitedCookId) @include(if: $includeLastVisitedCookProfiles) {
            ...PublicCookCardFields
        }
        user {
            ...PublicHeaderUser
        }
    }
    publicCook {
        findOneByPathName(pathName: $pathName) {
            cookId
            pathName
            biography
            biographySummary
            logo {
                url
            }
            cuisineStyle
            cookingPhilosophy
            city
            cityPage {
                pathName
                nameDe
                nameEn
            }
            minimumPriceAmount
            maximumPriceAmount
            minimumParticipants
            maximumParticipants
            callSchedulingEnabled
            user {
                display
                profilePicture {
                    url
                }
            }
            meals {
                mealId
                title
                description
                imageUrl
            }
            menus {
                menuId
                title
                description
                courseMealOptionImages
                courses {
                    courseId
                    title
                    mealOptions {
                        mealId
                        title
                        description
                        imageUrl
                    }
                }
            }
            testimonials {
                ...CustomerTestimonialCardFields
            }
            rating {
                averageRating
                reviewCount
            }
            canReceiveDirectRequests
        }
    }
}
