query PublicBlogPostPage($pathName: String!, $includeLastVisitedCookProfiles: Boolean!) {
    currentSession {
        activeFeatureToggleKeys
        lastVisitedCookProfiles @include(if: $includeLastVisitedCookProfiles) {
            ...PublicCookCardFields
        }
        user {
            ...PublicHeaderUser
        }
    }
    publicBlogPost {
        findOneByPathName(pathName: $pathName) {
            ...PublicBlogPostFields
        }
    }
}
