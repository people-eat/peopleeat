query HowToBecomeAChefPage {
    currentSession {
        activeFeatureToggleKeys
        user {
            ...PublicHeaderUser
        }
    }
    publicWebPage {
        findOne(webPageKey: HOW_TO_BECOME_A_CHEF) {
            titleDe
            titleEn
            titleNl
            descriptionDe
            descriptionEn
            descriptionNl
        }
    }
}
