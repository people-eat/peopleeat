query BookingRequestPlanPage($partnerId: ID!, $includePartner: Boolean!) {
    currentSession {
        ...AuthSessionFields
        user {
            ...PublicHeaderUser
        }
    }
    publicPartner {
        findOne(partnerId: $partnerId) @include(if: $includePartner) {
            ...PublicPartnerFields
        }
    }
}

mutation BookingRequestPlanCreate($input: UserBookingRequestCreate!) {
    user {
        bookingRequestCreate(input: $input) {
            success
            referenceId
        }
    }
}

query BookingRequestPlanLocationSuggestions($searchText: String!, $onlyFullAddresses: Boolean! = true) {
    currentSession {
        locationSuggestions(searchText: $searchText, onlyFullAddresses: $onlyFullAddresses) {
            displayText
            latitude
            longitude
            structuredAddress {
                displayText
                latitude
                longitude
                addressLine1
                addressLine2
                city
                postCode
                state
                country
            }
        }
    }
}
