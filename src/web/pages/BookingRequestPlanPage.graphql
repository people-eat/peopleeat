query BookingRequestPlanPage($venueId: ID!, $includeVenue: Boolean!) {
    currentSession {
        ...AuthSessionFields
        user {
            ...PublicHeaderUser
        }
    }
    publicWebPage {
        findOne(webPageKey: BOOKING_REQUEST_PLAN) {
            titleDe
            titleEn
            titleNl
            descriptionDe
            descriptionEn
            descriptionNl
        }
    }
    publicPartnerVenue {
        findOne(partnerVenueId: $venueId) @include(if: $includeVenue) {
            ...PublicPartnerVenueFields
        }
    }
}

mutation BookingRequestPlanCreate($input: UserBookingRequestCreate!) {
    user {
        bookingRequestCreate(input: $input) {
            success
            referenceId
        }
    }
}

query BookingRequestPlanLocationSuggestions($searchText: String!, $onlyFullAddresses: Boolean! = true) {
    currentSession {
        locationSuggestions(searchText: $searchText, onlyFullAddresses: $onlyFullAddresses) {
            displayText
            latitude
            longitude
            structuredAddress {
                displayText
                latitude
                longitude
                addressLine1
                addressLine2
                city
                postCode
                state
                country
            }
        }
    }
}

query BookingRequestPlanExpectedMenuPriceRange($participantsAdult: Int!, $participantsDiscounted: Int!) {
    bookingRequestExpectedMenuPriceRange(participantsAdult: $participantsAdult, participantsDiscounted: $participantsDiscounted) {
        minAmountCents
        maxAmountCents
    }
}
