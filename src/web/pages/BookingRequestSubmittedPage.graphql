# Ownership check for `/booking-request/$bookingRequestId/submitted`.

query BookingRequestSubmittedPage($bookingRequestId: ID!) {
    currentSession {
        sessionId
        activeFeatureToggleKeys
        user {
            userId
            bookingRequest(bookingRequestId: $bookingRequestId) {
                bookingRequestId
                isExclusive
                directRequestNeedsExpansion
                requestedCook {
                    cookId
                    pathName
                    user {
                        display
                        profilePicture {
                            url
                        }
                    }
                }
                requestedMenu {
                    menuId
                    title
                }
                kitchenDetails {
                    availability
                    fridgeSpace
                    platingSpace
                    guestTableware
                    notes
                    photos {
                        fileUploadId
                        url
                    }
                }
            }
        }
    }
}

mutation BookingRequestSubmittedKitchenDetailsUpdate(
    $bookingRequestId: ID!
    $kitchenDetails: BookingRequestKitchenDetailsInput
    $photoFileUploadIds: [ID!]
) {
    user {
        bookingRequestKitchenDetailsUpdate(
            bookingRequestId: $bookingRequestId
            kitchenDetails: $kitchenDetails
            photoFileUploadIds: $photoFileUploadIds
        ) {
            success
            referenceId
        }
    }
}
