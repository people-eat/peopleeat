query BookingRequestFormPage {
    currentSession {
        ...AuthSessionFields
        user {
            previousEventAddresses {
                displayText
                latitude
                longitude
                addressLine1
                addressLine2
                city
                postCode
                state
                country
            }
        }
    }
    publicWebPage {
        findOne(webPageKey: BOOKING_REQUEST_FORM) {
            titleDe
            titleEn
            descriptionDe
            descriptionEn
        }
    }
}

mutation BookingRequestFormCreate($input: UserBookingRequestCreate!) {
    user {
        bookingRequestCreate(input: $input) {
            success
            referenceId
        }
    }
}

query BookingRequestFormLocationSuggestions($searchText: String!, $onlyFullAddresses: Boolean! = true) {
    currentSession {
        locationSuggestions(searchText: $searchText, onlyFullAddresses: $onlyFullAddresses) {
            displayText
            latitude
            longitude
            structuredAddress {
                displayText
                latitude
                longitude
                addressLine1
                addressLine2
                city
                postCode
                state
                country
            }
        }
    }
}

query BookingRequestFormSessionDiscount($redeemCode: String!) {
    currentSession {
        discount(redeemCode: $redeemCode) {
            redeemCode
            name
            amountCents
        }
    }
}
