# Admin legal document management — history + draft for privacy / terms / imprint.
# Seed-and-subscribe via `adminUpdates`. See docs/features/admin-legal.md.

fragment AdminLegalDocumentPageAdmin on Admin {
    adminId
    legalPrivacyPolicies {
        privacyPolicyId
        bodyDe
        changeSummaryDe
        createdAt
        updatedAt
        publishedAt
    }
    legalTermsAndConditions {
        termsAndConditionsId
        bodyDe
        changeSummaryDe
        createdAt
        updatedAt
        publishedAt
    }
    legalImprints {
        imprintId
        bodyDe
        changeSummaryDe
        createdAt
        updatedAt
        publishedAt
    }
}

query AdminLegalDocumentPage {
    currentSession {
        sessionId
        user {
            userId
            admin {
                ...AdminLegalDocumentPageAdmin
            }
        }
    }
}

subscription AdminLegalDocumentPageUpdates {
    adminUpdates {
        ...AdminLegalDocumentPageAdmin
    }
}

mutation AdminLegalDocumentDraftUpsert($kind: LegalDocumentKind!, $input: AdminLegalDocumentDraftInput!) {
    admin {
        legalDocumentDraftUpsert(kind: $kind, input: $input) {
            success
            referenceId
        }
    }
}

mutation AdminLegalDocumentPublish($kind: LegalDocumentKind!, $documentId: ID!) {
    admin {
        legalDocumentPublish(kind: $kind, documentId: $documentId) {
            success
            referenceId
        }
    }
}
