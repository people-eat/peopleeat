# Admin sessions overview hub — kind distribution + creation time series +
# first-touch / UA insights. See docs/features/admin-sessions.md.
# `sessionCounts` order matches `ADMIN_SESSION_COUNT_CRITERIA` in
# AdminSessionsOverviewPage.tsx.

query AdminSessionsOverviewPage(
    $criteria: [AdminSessionCriterion!]!
    $range: DateTimeRange!
    $granularity: AdminTimeBucketGranularity! = day
    $insightsTake: Int! = 10
) {
    currentSession {
        sessionId
        user {
            userId
            admin {
                adminId
                sessionCounts(criteria: $criteria)
                sessionCreations(range: $range, granularity: $granularity) {
                    bucketStart
                    count
                }
                sessionInsights(range: $range, take: $insightsTake) {
                    sessionCount
                    landingPaths {
                        landingPath
                        count
                    }
                    referrers {
                        referrer
                        count
                    }
                    devices {
                        deviceClass
                        count
                    }
                    operatingSystems {
                        operatingSystem
                        count
                    }
                    browsers {
                        browser
                        count
                    }
                }
            }
        }
    }
}
