query AdminPartnersPage {
    currentSession {
        user {
            admin {
                adminId
                partners {
                    ...AdminPartnerFields
                }
            }
        }
    }
}

mutation AdminPartnerUpsert($input: PartnerUpsert!) {
    admin {
        partnerUpsert(input: $input) {
            success
            referenceId
        }
    }
}

mutation AdminPartnerDelete($partnerId: ID!) {
    admin {
        partnerDelete(partnerId: $partnerId) {
            success
            referenceId
        }
    }
}

mutation AdminPartnerVenueCreate($input: PartnerVenueUpsert!) {
    admin {
        partnerVenueUpsert(input: $input) {
            success
            referenceId
        }
    }
}

subscription AdminPartnersPageUpdates {
    adminUpdates {
        adminId
        partners {
            ...AdminPartnerFields
        }
    }
}
