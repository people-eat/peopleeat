# Admin public-page visit explorer. Loaded by `/admin/traffic`.
# See `docs/features/admin-traffic.md`.

query AdminTrafficPage(
    $range: DateTimeRange!
    $granularity: AdminTimeBucketGranularity!
    $webPageKeys: [WebPageKey!]
    $audience: AdminWebPageVisitAudience!
    $metric: AdminWebPageVisitMetric!
    $scope: AdminWebPageVisitScope!
    $entity: AdminWebPageVisitEntity
) {
    currentSession {
        user {
            admin {
                adminId
                webPageVisitTraffic(
                    range: $range
                    granularity: $granularity
                    webPageKeys: $webPageKeys
                    audience: $audience
                    metric: $metric
                    scope: $scope
                    entity: $entity
                ) {
                    pageviews
                    uniqueSessions
                    previousPageviews
                    previousUniqueSessions
                    entityVisitCount
                    untaggedDetailVisitCount
                    series {
                        webPageKey
                        entityId
                        label
                        pageviews
                        uniqueSessions
                        previousPageviews
                        previousUniqueSessions
                        buckets {
                            bucketStart
                            count
                        }
                        previousBuckets {
                            bucketStart
                            count
                        }
                    }
                    pageRanks {
                        webPageKey
                        pageviews
                        uniqueSessions
                        previousPageviews
                        previousUniqueSessions
                    }
                    entityRanks {
                        id
                        label
                        pathName
                        pageviews
                        uniqueSessions
                        previousPageviews
                        previousUniqueSessions
                    }
                }
            }
        }
    }
}

query AdminTrafficEntitySearch($webPageKey: WebPageKey!, $query: String!, $range: DateTimeRange!, $audience: AdminWebPageVisitAudience!) {
    currentSession {
        user {
            admin {
                adminId
                webPageVisitEntitySearch(webPageKey: $webPageKey, query: $query, range: $range, audience: $audience) {
                    id
                    label
                    pathName
                    pageviews
                    uniqueSessions
                }
            }
        }
    }
}
