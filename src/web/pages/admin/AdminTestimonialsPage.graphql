# Admin testimonials list — customer + cook catalogs combined.
# Cook `body` is aliased (`cookBody`) on the union selection — GraphQL field merging
# rejects `String!` vs `String` under the same response name.

fragment AdminTestimonialsListCustomer on AdminCustomerTestimonial {
    customerTestimonialId
    userId
    bookingRequestOfferId
    authorName
    displayAuthorName
    location
    displayLocation
    occasion
    displayOccasion
    body
    imageUrls
    rating
    publicationStatus
    publishedAt
    createdAt
    publicPagePlacements {
        kind
        entityId
        labelDe
        labelEn
        pathName
        index
    }
    user {
        userId
        firstName
        lastName
    }
}

query AdminTestimonialsPage {
    currentSession {
        user {
            admin {
                adminId
                testimonials {
                    __typename
                    ... on AdminCustomerTestimonial {
                        ...AdminTestimonialsListCustomer
                    }
                    ... on AdminCookTestimonial {
                        cookTestimonialId
                        cookId
                        userId
                        bookingRequestOfferId
                        authorName
                        displayAuthorName
                        location
                        displayLocation
                        occasion
                        displayOccasion
                        cookBody: body
                        imageUrls
                        rating
                        publicationStatus
                        publishedAt
                        createdAt
                        publicPagePlacements {
                            kind
                            entityId
                            labelDe
                            labelEn
                            pathName
                            index
                        }
                        cook {
                            cookId
                            user {
                                userId
                                firstName
                                lastName
                            }
                        }
                    }
                }
            }
        }
    }
}

subscription AdminTestimonialsPageUpdates {
    adminUpdates {
        testimonials {
            __typename
            ... on AdminCustomerTestimonial {
                ...AdminTestimonialsListCustomer
            }
            ... on AdminCookTestimonial {
                cookTestimonialId
                cookId
                userId
                bookingRequestOfferId
                authorName
                displayAuthorName
                location
                displayLocation
                occasion
                displayOccasion
                cookBody: body
                imageUrls
                rating
                publicationStatus
                publishedAt
                createdAt
                publicPagePlacements {
                    kind
                    entityId
                    labelDe
                    labelEn
                    pathName
                    index
                }
                cook {
                    cookId
                    user {
                        userId
                        firstName
                        lastName
                    }
                }
            }
        }
    }
}

mutation AdminCustomerTestimonialPublish($customerTestimonialId: ID!, $publicationStatus: TestimonialPublicationStatus!) {
    admin {
        customerTestimonialPublish(customerTestimonialId: $customerTestimonialId, publicationStatus: $publicationStatus) {
            success
            referenceId
        }
    }
}

mutation AdminCookTestimonialPublish($cookTestimonialId: ID!, $publicationStatus: TestimonialPublicationStatus!) {
    admin {
        cookTestimonialPublish(cookTestimonialId: $cookTestimonialId, publicationStatus: $publicationStatus) {
            success
            referenceId
        }
    }
}

mutation AdminCustomerTestimonialDelete($customerTestimonialId: ID!) {
    admin {
        customerTestimonialDelete(customerTestimonialId: $customerTestimonialId) {
            success
            referenceId
        }
    }
}

mutation AdminCookTestimonialDelete($cookTestimonialId: ID!) {
    admin {
        cookTestimonialDelete(cookTestimonialId: $cookTestimonialId) {
            success
            referenceId
        }
    }
}

mutation AdminCustomerTestimonialUpsert($input: AdminCustomerTestimonialUpsert!) {
    admin {
        customerTestimonialUpsert(input: $input) {
            success
            referenceId
        }
    }
}

mutation AdminCookTestimonialUpsert($input: AdminCookTestimonialUpsert!) {
    admin {
        cookTestimonialUpsert(input: $input) {
            success
            referenceId
        }
    }
}
