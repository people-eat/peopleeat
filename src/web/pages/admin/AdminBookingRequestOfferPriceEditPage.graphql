# Admin offer price edit. Loaded by
# `/admin/booking-requests/$bookingRequestId/offers/$bookingRequestOfferId/edit-price`.

fragment AdminBookingRequestOfferPriceEditPageOffer on AdminBookingRequestOffer {
    bookingRequestOfferId
    bookingRequestId
    userAccepted
    cookAccepted
    paymentStatus
    canRequestParticipantAmendment
    menuPriceCents
    travelExpensesCents
    travelDistanceKm
    totalCentsCustomer
    totalWithoutDiscountsCentsCustomer
    payoutCentsCook
    paymentDateTime
    plannedPayoutDateTime
    payoutDateTime
    cook {
        cookId
        user {
            firstName
            lastName
        }
    }
}

fragment AdminBookingRequestOfferPriceEditPageRequest on AdminBookingRequest {
    bookingRequestId
    occasion
    priceClassType
    suggestedOfferAmountCents
    minOfferAmountCents
    maxOfferAmountCents
    minOfferAmountHardCents
    participants {
        bookingRequestParticipantId
        type
    }
}

query AdminBookingRequestOfferPriceEditPage($bookingRequestId: ID!, $bookingRequestOfferId: ID!) {
    currentSession {
        user {
            admin {
                adminId
                bookingRequest(bookingRequestId: $bookingRequestId) {
                    ...AdminBookingRequestOfferPriceEditPageRequest
                }
                bookingRequestOffer(bookingRequestOfferId: $bookingRequestOfferId) {
                    ...AdminBookingRequestOfferPriceEditPageOffer
                }
            }
        }
    }
}

mutation AdminBookingRequestOfferAmendmentCreate($bookingRequestOfferId: ID!, $input: AdminBookingRequestOfferAmendmentInput!) {
    admin {
        bookingRequestOfferAmendmentCreate(bookingRequestOfferId: $bookingRequestOfferId, input: $input) {
            success
            referenceId
        }
    }
}

mutation AdminBookingRequestOfferAmendmentApply($bookingRequestOfferId: ID!, $input: AdminBookingRequestOfferAmendmentInput!) {
    admin {
        bookingRequestOfferAmendmentApply(bookingRequestOfferId: $bookingRequestOfferId, input: $input) {
            success
            referenceId
        }
    }
}
