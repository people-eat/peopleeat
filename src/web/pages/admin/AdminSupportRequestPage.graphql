# Admin support-request detail + chat. See docs/features/support-requests.md.

fragment AdminSupportRequestDetailFields on AdminSupportRequest {
    supportRequestId
    subject
    status
    adminUnreadNotificationCount
    createdAt
    resolvedAt
    bookingRequest {
        bookingRequestId
        occasion
        dateTime
    }
    customer {
        userId
        firstName
        lastName
        profilePicture {
            fileUploadId
            url
        }
    }
    messages {
        ...HumanChatMessageFields
    }
}

query AdminSupportRequestPage($supportRequestId: ID!) {
    currentSession {
        user {
            userId
            admin {
                adminId
                supportRequest(supportRequestId: $supportRequestId) {
                    ...AdminSupportRequestDetailFields
                }
            }
        }
    }
}

subscription AdminSupportRequestPageUpdates($supportRequestId: ID!) {
    adminUpdates {
        adminId
        supportRequest(supportRequestId: $supportRequestId) {
            ...AdminSupportRequestDetailFields
        }
    }
}

mutation AdminSupportRequestMessageCreate($supportRequestId: ID!, $message: String!, $fileUploadIds: [ID!]) {
    admin {
        supportRequestMessageCreate(supportRequestId: $supportRequestId, message: $message, fileUploadIds: $fileUploadIds) {
            success
            referenceId
        }
    }
}

mutation AdminSupportRequestUnreadNotificationCountReset($supportRequestId: ID!) {
    admin {
        supportRequestUnreadNotificationCountReset(supportRequestId: $supportRequestId) {
            success
            referenceId
        }
    }
}

mutation AdminSupportRequestResolve($supportRequestId: ID!, $notifyCustomer: Boolean! = true) {
    admin {
        supportRequestResolve(supportRequestId: $supportRequestId, notifyCustomer: $notifyCustomer) {
            success
            referenceId
        }
    }
}
