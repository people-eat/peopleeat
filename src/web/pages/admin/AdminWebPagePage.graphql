# Admin fixed-route SEO detail. Seed-and-subscribe on `adminUpdates`.
# Ghost keys return shared defaults with persisted=false until first save.
# See docs/features/admin-web-pages.md.

query AdminWebPagePage($webPageKey: WebPageKey!, $range: DateTimeRange!, $granularity: AdminTimeBucketGranularity! = week) {
    currentSession {
        user {
            admin {
                adminId
                webPage(webPageKey: $webPageKey) {
                    webPageKey
                    titleDe
                    titleEn
                    titleNl
                    descriptionDe
                    descriptionEn
                    descriptionNl
                    persisted
                    updatedAt
                }
                webPageVisitTraffic(
                    range: $range
                    granularity: $granularity
                    webPageKeys: [$webPageKey]
                    audience: HUMAN
                    metric: PAGEVIEWS
                    scope: ALL
                ) {
                    pageviews
                    series {
                        webPageKey
                        label
                        buckets {
                            bucketStart
                            count
                        }
                    }
                }
            }
        }
    }
}

mutation AdminWebPageUpsert($webPageKey: WebPageKey!, $input: AdminWebPageUpsert!) {
    admin {
        webPageUpsert(webPageKey: $webPageKey, input: $input) {
            success
            referenceId
        }
    }
}

mutation AdminWebPageSeoTranslate($webPageKey: WebPageKey!, $locale: Locale!, $titleDe: String!, $descriptionDe: String!) {
    admin {
        webPageSeoTranslate(webPageKey: $webPageKey, locale: $locale, titleDe: $titleDe, descriptionDe: $descriptionDe) {
            title
            description
        }
    }
}

subscription AdminWebPagePageUpdates($webPageKey: WebPageKey!) {
    adminUpdates {
        adminId
        webPage(webPageKey: $webPageKey) {
            webPageKey
            titleDe
            titleEn
            titleNl
            descriptionDe
            descriptionEn
            descriptionNl
            persisted
            updatedAt
        }
    }
}
