query AdminPartnerVenuePage($partnerVenueId: ID!) {
    currentSession {
        user {
            admin {
                adminId
                partnerVenue(partnerVenueId: $partnerVenueId) {
                    ...AdminPartnerVenueFields
                }
                partners {
                    partnerId
                    name
                }
                testimonials {
                    ...AdminTestimonialCardFields
                }
            }
        }
    }
}

mutation AdminPartnerVenueUpsert($input: PartnerVenueUpsert!) {
    admin {
        partnerVenueUpsert(input: $input) {
            success
            referenceId
        }
    }
}

mutation AdminPartnerVenueCooksUpdate($partnerVenueId: ID!, $cookIds: [ID!]!) {
    admin {
        partnerVenueCooksUpdate(partnerVenueId: $partnerVenueId, cookIds: $cookIds) {
            success
            referenceId
        }
    }
}

mutation AdminPartnerVenueTestimonialsUpdate($partnerVenueId: ID!, $entries: [TestimonialJunctionEntryInput!]!) {
    admin {
        partnerVenueTestimonialsUpdate(partnerVenueId: $partnerVenueId, entries: $entries) {
            success
            referenceId
        }
    }
}

mutation AdminPartnerVenueDelete($partnerVenueId: ID!) {
    admin {
        partnerVenueDelete(partnerVenueId: $partnerVenueId) {
            success
            referenceId
        }
    }
}

query AdminPartnerVenuePageCookSearch($criterion: AdminUserCriterion!) {
    currentSession {
        user {
            admin {
                users(criterion: $criterion) {
                    userId
                    firstName
                    lastName
                    status
                    cook {
                        cookId
                        isVisible
                        isApprovedByAdmin
                        cuisineStyle
                        exactTravelOriginAddress {
                            city
                        }
                    }
                }
            }
        }
    }
}

query AdminPartnerVenuePageLocationSuggestions($searchText: String!, $onlyFullAddresses: Boolean!) {
    currentSession {
        locationSuggestions(searchText: $searchText, onlyFullAddresses: $onlyFullAddresses) {
            displayText
            latitude
            longitude
            structuredAddress {
                displayText
                latitude
                longitude
                addressLine1
                addressLine2
                city
                postCode
                state
                country
            }
        }
    }
}

query AdminPartnerVenuePagePromoCodes($criterion: AdminPromoCodeCriterion!) {
    currentSession {
        user {
            admin {
                promoCodes(criterion: $criterion) {
                    promoCodeId
                    redeemCode
                    amountCents
                    expiresAt
                    scopedBookingRequestId
                }
            }
        }
    }
}

subscription AdminPartnerVenuePageUpdates($partnerVenueId: ID!) {
    adminUpdates {
        adminId
        partnerVenue(partnerVenueId: $partnerVenueId) {
            ...AdminPartnerVenueFields
        }
    }
}
