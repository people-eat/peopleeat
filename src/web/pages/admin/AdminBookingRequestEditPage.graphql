# Admin booking-request edit. Loaded by `/admin/booking-requests/$bookingRequestId/edit`.

fragment AdminBookingRequestEditPageRequest on AdminBookingRequest {
    bookingRequestId
    occasion
    dateTime
    priceClassType
    originalMessage
    adjustedMessage
    preferences
    expiresAt
    createdAt
    exactEventAddress {
        displayText
        latitude
        longitude
        addressLine1
        addressLine2
        city
        postCode
        state
        country
    }
    participants {
        bookingRequestParticipantId
        type
        name
        restrictions
    }
    offers {
        bookingRequestOfferId
    }
}

query AdminBookingRequestEditPage($bookingRequestId: ID!) {
    currentSession {
        user {
            admin {
                adminId
                bookingRequest(bookingRequestId: $bookingRequestId) {
                    ...AdminBookingRequestEditPageRequest
                }
            }
        }
    }
}

mutation AdminBookingRequestUpdate($bookingRequestId: ID!, $input: AdminBookingRequestUpdate!) {
    admin {
        bookingRequestUpdate(bookingRequestId: $bookingRequestId, input: $input) {
            success
            referenceId
        }
    }
}

query AdminBookingRequestEditLocationSuggestions($searchText: String!, $onlyFullAddresses: Boolean! = true) {
    currentSession {
        locationSuggestions(searchText: $searchText, onlyFullAddresses: $onlyFullAddresses) {
            displayText
            latitude
            longitude
            structuredAddress {
                displayText
                latitude
                longitude
                addressLine1
                addressLine2
                city
                postCode
                state
                country
            }
        }
    }
}

query AdminBookingRequestEditTravelImpact($bookingRequestId: ID!, $exactEventAddress: AdminBookingRequestExactEventAddressInput!) {
    currentSession {
        user {
            admin {
                bookingRequest(bookingRequestId: $bookingRequestId) {
                    bookingRequestId
                    travelImpact(exactEventAddress: $exactEventAddress) {
                        bookingRequestOfferId
                        cookDisplay
                        travelDistanceKmBefore
                        travelDistanceKmAfter
                        travelExpensesCentsBefore
                        travelExpensesCentsAfter
                    }
                }
            }
        }
    }
}

query AdminBookingRequestEditPriceImpact($bookingRequestId: ID!, $participantsAdult: Int!, $participantsDiscounted: Int!) {
    currentSession {
        user {
            admin {
                bookingRequest(bookingRequestId: $bookingRequestId) {
                    bookingRequestId
                    priceImpact(participantsAdult: $participantsAdult, participantsDiscounted: $participantsDiscounted) {
                        bookingRequestOfferId
                        cookDisplay
                        menuPriceCentsBefore
                        menuPriceCentsAfter
                        totalWithoutDiscountsCentsCustomerBefore
                        totalWithoutDiscountsCentsCustomerAfter
                        payoutCentsCookBefore
                        payoutCentsCookAfter
                    }
                }
            }
        }
    }
}
