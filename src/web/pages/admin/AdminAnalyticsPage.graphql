# Admin analytics overview. Loaded by `/admin/analytics`.
# See `docs/features/admin-analytics.md`. URL `tab` selects Booking / Cooks /
# Sign-in / Gift cards; each tab’s aggregations load only via `@include`.

query AdminAnalyticsPage(
    $range: DateTimeRange!
    $granularity: AdminTimeBucketGranularity! = day
    $formVisitWebPageKey: WebPageKey!
    $giftCardVisitWebPageKey: WebPageKey!
    $includeBooking: Boolean!
    $includeCooks: Boolean!
    $includeSignIn: Boolean!
    $includeGiftCards: Boolean!
) {
    currentSession {
        sessionId
        user {
            userId
            admin {
                adminId
                bookingRequestFormFlow(range: $range) @include(if: $includeBooking) {
                    nodes {
                        id
                        label
                    }
                    links {
                        source
                        target
                        value
                    }
                    steps {
                        id
                        label
                        enteredCount
                        completedCount
                    }
                    sessionsWithCompletion
                    bookingRequestsCreated
                }
                formVisits: sessionEventWebPageVisitCreations(webPageKey: $formVisitWebPageKey, range: $range, granularity: $granularity)
                    @include(if: $includeBooking) {
                    bucketStart
                    count
                }
                bookingRequestCheckoutFlow(range: $range) @include(if: $includeBooking) {
                    nodes {
                        id
                        label
                    }
                    links {
                        source
                        target
                        value
                    }
                    steps {
                        id
                        label
                        enteredCount
                        completedCount
                    }
                    sessionsWithCompletion
                    terminalCount
                }
                bookingRequestMarketplaceStats(range: $range) @include(if: $includeBooking) {
                    requestCount
                    withOfferCount
                    dualAcceptedCount
                    paidCount
                    paymentFailedCount
                    chefDirectCount
                    radiusCount
                }
                customerSessionActivity(range: $range) @include(if: $includeBooking) {
                    customerCount
                    weekBuckets {
                        bucketStart
                        count
                    }
                    monthBuckets {
                        bucketStart
                        count
                    }
                }
                cookSessionActivity(range: $range) @include(if: $includeCooks) {
                    cookCount
                    productiveCookCount
                    weekBuckets {
                        bucketStart
                        count
                    }
                    monthBuckets {
                        bucketStart
                        count
                    }
                }
                chefSignUpFlow(range: $range) @include(if: $includeCooks) {
                    nodes {
                        id
                        label
                    }
                    links {
                        source
                        target
                        value
                    }
                    steps {
                        id
                        label
                        enteredCount
                        completedCount
                    }
                    sessionsWithCompletion
                    terminalCount
                }
                cookBookingRequestOfferFlow(range: $range) @include(if: $includeCooks) {
                    nodes {
                        id
                        label
                    }
                    links {
                        source
                        target
                        value
                    }
                    steps {
                        id
                        label
                        enteredCount
                        completedCount
                    }
                    notifiedCount
                    openedCount
                    declinedCount
                    offersCreatedCount
                    medianNotifyToOfferMinutes
                }
                signInMethodStats(range: $range) @include(if: $includeSignIn) {
                    methods {
                        method
                        signInCount
                        registrationTicketCount
                        accountCreatedCount
                        failedCount
                    }
                    buckets {
                        date
                        method
                        signInCount
                    }
                }
                giftCardVisits: sessionEventWebPageVisitCreations(
                    webPageKey: $giftCardVisitWebPageKey
                    range: $range
                    granularity: $granularity
                ) @include(if: $includeGiftCards) {
                    bucketStart
                    count
                }
                giftCardFlow(range: $range) @include(if: $includeGiftCards) {
                    nodes {
                        id
                        label
                    }
                    links {
                        source
                        target
                        value
                    }
                    steps {
                        id
                        label
                        enteredCount
                        completedCount
                    }
                    sessionsWithCompletion
                    terminalCount
                }
            }
        }
    }
}
