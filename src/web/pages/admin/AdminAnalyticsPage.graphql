# Admin analytics overview. Loaded by `/admin/analytics`.
# See `docs/features/admin-analytics.md`.

query AdminAnalyticsPage($range: DateTimeRange!, $granularity: AdminTimeBucketGranularity! = day, $formVisitWebPageKey: WebPageKey!) {
    currentSession {
        sessionId
        user {
            userId
            admin {
                adminId
                bookingRequestFormFlow(range: $range) {
                    nodes {
                        id
                        label
                    }
                    links {
                        source
                        target
                        value
                    }
                    steps {
                        id
                        label
                        enteredCount
                        completedCount
                    }
                    sessionsWithCompletion
                    bookingRequestsCreated
                }
                giftCardFlow(range: $range) {
                    nodes {
                        id
                        label
                    }
                    links {
                        source
                        target
                        value
                    }
                    steps {
                        id
                        label
                        enteredCount
                        completedCount
                    }
                    sessionsWithCompletion
                    terminalCount
                }
                chefSignUpFlow(range: $range) {
                    nodes {
                        id
                        label
                    }
                    links {
                        source
                        target
                        value
                    }
                    steps {
                        id
                        label
                        enteredCount
                        completedCount
                    }
                    sessionsWithCompletion
                    terminalCount
                }
                bookingRequestCheckoutFlow(range: $range) {
                    nodes {
                        id
                        label
                    }
                    links {
                        source
                        target
                        value
                    }
                    steps {
                        id
                        label
                        enteredCount
                        completedCount
                    }
                    sessionsWithCompletion
                    terminalCount
                }
                cookBookingRequestOfferFlow(range: $range) {
                    nodes {
                        id
                        label
                    }
                    links {
                        source
                        target
                        value
                    }
                    steps {
                        id
                        label
                        enteredCount
                        completedCount
                    }
                    notifiedCount
                    openedCount
                    declinedCount
                    offersCreatedCount
                }
                formVisits: sessionEventWebPageVisitCreations(webPageKey: $formVisitWebPageKey, range: $range, granularity: $granularity) {
                    bucketStart
                    count
                }
                signInMethodStats(range: $range) {
                    methods {
                        method
                        signInCount
                        registrationTicketCount
                        accountCreatedCount
                        failedCount
                    }
                    buckets {
                        date
                        method
                        signInCount
                    }
                }
            }
        }
    }
}
