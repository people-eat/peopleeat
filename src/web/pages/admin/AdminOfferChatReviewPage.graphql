# Focused offer-chat review surface — full transcript + acknowledge → next.

fragment AdminOfferChatReviewPageOffer on AdminBookingRequestOffer {
    bookingRequestOfferId
    bookingRequestId
    status
    adminChatReviewPendingCount
    adminChatReviewedAt
    cook {
        cookId
        user {
            userId
            firstName
            lastName
            profilePicture {
                url
            }
        }
    }
    bookingRequest {
        bookingRequestId
        occasion
        dateTime
        customer {
            userId
            firstName
            lastName
            emailAddress
            profilePicture {
                url
            }
        }
    }
    messages {
        ...HumanChatMessageFields
    }
}

query AdminOfferChatReviewPage($bookingRequestOfferId: ID!) {
    currentSession {
        sessionId
        user {
            userId
            admin {
                adminId
                bookingRequestOffer(bookingRequestOfferId: $bookingRequestOfferId) {
                    ...AdminOfferChatReviewPageOffer
                }
            }
        }
    }
}

subscription AdminOfferChatReviewPageUpdates($bookingRequestOfferId: ID!) {
    adminUpdates {
        bookingRequestOffer(bookingRequestOfferId: $bookingRequestOfferId) {
            ...AdminOfferChatReviewPageOffer
        }
    }
}

mutation AdminBookingRequestOfferChatReviewAcknowledge($bookingRequestOfferId: ID!) {
    admin {
        bookingRequestOfferChatReviewAcknowledge(bookingRequestOfferId: $bookingRequestOfferId) {
            acknowledgedOfferId
            nextOfferId
        }
    }
}

mutation AdminOfferChatReviewChatMessageReactionUpsert($bookingRequestOfferEventId: ID!, $emoji: String!) {
    admin {
        bookingRequestOfferChatMessageReactionUpsert(bookingRequestOfferEventId: $bookingRequestOfferEventId, emoji: $emoji) {
            success
            referenceId
        }
    }
}

mutation AdminOfferChatReviewChatMessageUpdate($bookingRequestOfferEventId: ID!, $message: String!) {
    admin {
        bookingRequestOfferChatMessageUpdate(bookingRequestOfferEventId: $bookingRequestOfferEventId, message: $message) {
            success
            referenceId
        }
    }
}

mutation AdminOfferChatReviewChatMessageVisibilityUpdate($bookingRequestOfferEventId: ID!, $hiddenByAdmin: Boolean!) {
    admin {
        bookingRequestOfferChatMessageVisibilityUpdate(
            bookingRequestOfferEventId: $bookingRequestOfferEventId
            hiddenByAdmin: $hiddenByAdmin
        ) {
            success
            referenceId
        }
    }
}

mutation AdminOfferChatReviewChatMessageDelete($bookingRequestOfferEventId: ID!) {
    admin {
        bookingRequestOfferChatMessageDelete(bookingRequestOfferEventId: $bookingRequestOfferEventId) {
            success
            referenceId
        }
    }
}
