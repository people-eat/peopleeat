# Admin session detail. Loaded by `/admin/sessions/$sessionId`.
# See `docs/features/admin-sessions.md`. URL `tab` selects overview vs events;
# events load only for the events tab via `@include` (loaderDeps on `tab`, plus
# `page` / `pageSize` for pagination).

query AdminSessionPage($sessionId: ID!, $includeEvents: Boolean!, $eventsCriterion: AdminSessionEventCriterion!) {
    currentSession {
        sessionId
        user {
            userId
            admin {
                adminId
                session(sessionId: $sessionId) {
                    sessionId
                    userId
                    user {
                        userId
                        firstName
                        lastName
                        profilePicture {
                            url
                        }
                    }
                    lastInteractionAt
                    wasTerminatedAt
                    connectionActive
                    userAgent
                    ipHash
                    referrer
                    landingPath
                    isBot
                    createdAt
                }
                sessionEvents(criterion: $eventsCriterion) @include(if: $includeEvents) {
                    sessionEventId
                    sessionId
                    type
                    descriptionDe
                    descriptionEn
                    createdAt
                    link
                }
                sessionEventsCounts(criteria: [$eventsCriterion]) @include(if: $includeEvents)
            }
        }
    }
}
