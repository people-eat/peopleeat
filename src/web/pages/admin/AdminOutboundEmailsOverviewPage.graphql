# Admin outbound emails overview — Resend quota + lifecycle distribution +
# creation time series + recipient / purpose rankings.
# See docs/features/admin-outbound-emails.md.
# `outboundEmailsCounts` order matches `ADMIN_OUTBOUND_EMAIL_COUNT_CRITERIA` in
# AdminOutboundEmailsOverviewPage.tsx.

query AdminOutboundEmailsOverviewPage(
    $criteria: [AdminOutboundEmailCriterion!]!
    $range: DateTimeRange!
    $granularity: AdminTimeBucketGranularity! = day
    $recipientStatsTake: Int! = 5
    $purposeStatsTake: Int! = 5
) {
    currentSession {
        sessionId
        user {
            userId
            admin {
                adminId
                resendUsage {
                    monthly {
                        used
                        limit
                        sent
                        received
                        resetsAt
                    }
                    daily {
                        used
                        limit
                        sent
                        received
                        resetsAt
                    }
                }
                outboundEmailsCounts(criteria: $criteria)
                outboundEmailCreations(range: $range, granularity: $granularity) {
                    bucketStart
                    count
                }
                outboundEmailRecipientStats(take: $recipientStatsTake) {
                    toEmail
                    count
                    userId
                    displayName
                }
                outboundEmailPurposeStats(take: $purposeStatsTake) {
                    purpose
                    count
                }
            }
        }
    }
}
