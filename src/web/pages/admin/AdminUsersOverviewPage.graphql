# Admin users overview hub — membership distribution, registration time series,
# demographic insights, and upcoming birthdays. See docs/features/admin-users.md.
# `userCounts` order matches `ADMIN_USER_COUNT_CRITERIA` in AdminUsersOverviewPage.tsx.

query AdminUsersOverviewPage(
    $criteria: [AdminUserCriterion!]!
    $range: DateTimeRange!
    $granularity: AdminTimeBucketGranularity! = day
    $upcomingBirthdaysTake: Int! = 12
) {
    currentSession {
        sessionId
        user {
            userId
            admin {
                adminId
                userCounts(criteria: $criteria)
                userRegistrations(range: $range, granularity: $granularity) {
                    bucketStart
                    count
                }
                userInsights {
                    accountCount
                    medianAge
                    averageAge
                    birthDateSampleSize
                    preferredCommunication {
                        preferredCommunication
                        count
                    }
                    locales {
                        locale
                        count
                    }
                    timeZones {
                        timeZone
                        count
                    }
                }
                upcomingBirthdays(take: $upcomingBirthdaysTake) {
                    userId
                    firstName
                    lastName
                    birthDate
                    nextBirthday
                }
            }
        }
    }
}
