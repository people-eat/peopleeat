# City CMS detail. Seed-and-subscribe on `adminUpdates`. 90-day visit sparkline
# on the SEO tab uses `webPageVisitTraffic` (not the subscription).
# See docs/features/cities.md.

query AdminCityPage($cityId: ID!, $range: DateTimeRange!, $granularity: AdminTimeBucketGranularity! = week) {
    currentSession {
        user {
            admin {
                adminId
                city(cityId: $cityId) {
                    ...AdminCityFields
                }
                testimonials {
                    ...AdminTestimonialCardFields
                }
                webPageVisitTraffic(
                    range: $range
                    granularity: $granularity
                    webPageKeys: [CITIES]
                    audience: HUMAN
                    metric: PAGEVIEWS
                    scope: ALL
                    entity: { cityIds: [$cityId] }
                ) {
                    series {
                        entityId
                        label
                        pageviews
                        buckets {
                            bucketStart
                            count
                        }
                    }
                }
            }
        }
    }
    publicCity {
        findMany {
            pathName
            nameDe
            nameEn
            nameNl
            countryCode
        }
    }
}

mutation AdminCityUpsert($input: CityUpsert!) {
    admin {
        cityUpsert(input: $input) {
            success
            referenceId
        }
    }
}

mutation AdminCityCopyTranslate($locale: Locale!, $input: AdminCityCopyTranslateInput!) {
    admin {
        cityCopyTranslate(locale: $locale, input: $input) {
            name
            title
            description
            headline
            subHeadline
            firstSectionHeadline
            firstSectionBody
        }
    }
}

mutation AdminCityCooksUpdate($cityId: ID!, $cookIds: [ID!]!) {
    admin {
        cityCooksUpdate(cityId: $cityId, cookIds: $cookIds) {
            success
            referenceId
        }
    }
}

mutation AdminCityTestimonialsUpdate($cityId: ID!, $entries: [TestimonialJunctionEntryInput!]!) {
    admin {
        cityTestimonialsUpdate(cityId: $cityId, entries: $entries) {
            success
            referenceId
        }
    }
}

query AdminCityPageLocationSuggestions($searchText: String!, $onlyFullAddresses: Boolean! = false) {
    currentSession {
        locationSuggestions(searchText: $searchText, onlyFullAddresses: $onlyFullAddresses) {
            displayText
            latitude
            longitude
            structuredAddress {
                city
            }
        }
    }
}

subscription AdminCityPageUpdates($cityId: ID!) {
    adminUpdates {
        adminId
        city(cityId: $cityId) {
            ...AdminCityFields
        }
    }
}
