query PublicVenuesPage {
    currentSession {
        user {
            ...PublicHeaderUser
        }
    }
    publicPartnerVenue {
        findMany {
            pathName
            titleDe
            titleEn
            descriptionDe
            descriptionEn
            heroImageUrl
        }
    }
    publicWebPage {
        findOne(webPageKey: VENUES) {
            titleDe
            titleEn
            descriptionDe
            descriptionEn
        }
    }
}
