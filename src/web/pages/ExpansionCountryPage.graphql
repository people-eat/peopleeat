query ExpansionCountryPage($countryCode: CityCountryCode!) {
    currentSession {
        activeFeatureToggleKeys
        user {
            ...PublicHeaderUser
        }
    }
    publicCity {
        findMany(countryCode: $countryCode) {
            pathName
            nameDe
            nameEn
            nameNl
            countryCode
            latitude
            longitude
        }
    }
}
