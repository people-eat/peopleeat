# Cook-nav badge counts, derived server-side (`Cook.attentionCounts`). Seeded from
# ProfilePage; live via userUpdates.

fragment CookSidebarNavBadges on Cook {
    cookId
    attentionCounts {
        bookingRequestPoolCount
        bookingRequestOfferUnreadCount
        walletNeedsAttention
    }
}

fragment CookSidebarNavBadgesUser on User {
    userId
    cook {
        ...CookSidebarNavBadges
    }
}

subscription CookSidebarNavBadgesUpdates {
    userUpdates {
        ...CookSidebarNavBadgesUser
    }
}
