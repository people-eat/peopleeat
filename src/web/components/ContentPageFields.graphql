fragment CookTestimonialCardFields on CookTestimonial {
    cookTestimonialId
    authorName
    location
    occasion
    body
    imageUrls
    rating
    publishedAt
    createdAt
}

# Public curated testimonial (`CityTestimonial` / `PartnerTestimonial` / `OccasionTestimonial.testimonial`).
#
# `body` is aliased on the cook branch (`String` — cook reviews may omit body) because GraphQL's field-merging rule flags
# `String!` vs `String` for the same response name even across mutually exclusive union members. Inlined rather than
# spreading `CookTestimonialCardFields` so the alias doesn't leak into that fragment's other (non-union) usages.
fragment TestimonialCardFields on Testimonial {
    __typename
    ... on CustomerTestimonial {
        ...CustomerTestimonialCardFields
    }
    ... on CookTestimonial {
        cookTestimonialId
        authorName
        location
        occasion
        cookBody: body
        imageUrls
        rating
        publishedAt
        createdAt
    }
}

fragment AdminCustomerTestimonialCardFields on AdminCustomerTestimonial {
    customerTestimonialId
    displayAuthorName
    displayLocation
    displayOccasion
    body
    rating
    publicationStatus
}

fragment AdminCookTestimonialCardFields on AdminCookTestimonial {
    cookTestimonialId
    displayAuthorName
    displayLocation
    displayOccasion
    body
    rating
    publicationStatus
}

# Admin curated testimonial (`AdminCityTestimonial` / `AdminPartnerTestimonial` / `AdminOccasionTestimonial.testimonial`).
# See `TestimonialCardFields` above for why the cook branch is inlined with an aliased `body`.
fragment AdminTestimonialCardFields on AdminTestimonial {
    __typename
    ... on AdminCustomerTestimonial {
        ...AdminCustomerTestimonialCardFields
    }
    ... on AdminCookTestimonial {
        cookTestimonialId
        displayAuthorName
        displayLocation
        displayOccasion
        cookBody: body
        rating
        publicationStatus
    }
}

