fragment ContentSectionFields on ContentSection {
    __typename
    ... on ContentSectionContent {
        sectionId
        titleDe
        titleEn
        subtitleDe
        subtitleEn
        contentBodyDe: bodyDe
        contentBodyEn: bodyEn
        contentImageFileUploadId: imageFileUploadId
        contentImageUrl: imageUrl
        imageFirst
    }
    ... on ContentSectionImage {
        sectionId
        imageImageFileUploadId: imageFileUploadId
        imageImageUrl: imageUrl
    }
    ... on ContentSectionQuote {
        sectionId
        quoteDe
        quoteEn
        attributionDe
        attributionEn
    }
    ... on ContentSectionList {
        sectionId
        titleDe
        titleEn
        style
        itemsDe
        itemsEn
    }
    ... on ContentSectionCta {
        sectionId
        headlineDe
        headlineEn
        ctaBodyDe: bodyDe
        ctaBodyEn: bodyEn
        buttonLabelDe
        buttonLabelEn
        href
    }
    ... on ContentSectionQa {
        sectionId
        titleDe
        titleEn
        entries {
            entryId
            questionDe
            questionEn
            answerDe
            answerEn
        }
    }
}

