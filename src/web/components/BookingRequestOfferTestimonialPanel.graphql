mutation UserBookingRequestOfferTestimonialUpsert($input: UserBookingRequestOfferTestimonialUpsert!) {
    user {
        bookingRequestOfferTestimonialUpsert(input: $input) {
            success
            referenceId
        }
    }
}

mutation CookBookingRequestOfferTestimonialUpsert($input: CookBookingRequestOfferTestimonialUpsert!) {
    user {
        cook {
            bookingRequestOfferTestimonialUpsert(input: $input) {
                success
                referenceId
            }
        }
    }
}
