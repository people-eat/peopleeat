# Customer-nav badge counts, derived server-side (`User.attentionCounts`). Seeded
# from ProfilePage; live via userUpdates.

fragment CustomerSidebarNavBadges on User {
    userId
    attentionCounts {
        supportRequestUnreadCount
    }
}

subscription CustomerSidebarNavBadgesUpdates {
    userUpdates {
        ...CustomerSidebarNavBadges
    }
}
