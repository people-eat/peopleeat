query CookCreateLocationSuggestions($searchText: String!, $onlyFullAddresses: Boolean! = true) {
    currentSession {
        locationSuggestions(searchText: $searchText, onlyFullAddresses: $onlyFullAddresses) {
            displayText
            latitude
            longitude
            structuredAddress {
                displayText
                latitude
                longitude
                addressLine1
                addressLine2
                city
                postCode
                state
                country
            }
        }
    }
}
