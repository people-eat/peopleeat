name: Pipeline

on:
  pull_request:
    branches: [main, production]
  push:
    branches: [main, production]
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Change set
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: filter
        run: |
          set -euo pipefail
          # Docs-only = every changed path is markdown or under docs/. Anything else is code
          # (src, e2e, configs, lockfile, workflows, …) and must run Test / E2e / full Check.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            BASE="${{ github.event.before }}"
          else
            echo "No reliable base commit — treating as code changes"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t CHANGED < <(git diff --name-only "$BASE"...${{ github.sha }})
          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo "Empty change set — treating as code changes"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NON_DOCS=()
          for path in "${CHANGED[@]}"; do
            case "$path" in
              docs/*|*.md|AGENTS.md|CLAUDE.md) ;;
              *) NON_DOCS+=("$path") ;;
            esac
          done

          if [ "${#NON_DOCS[@]}" -eq 0 ]; then
            echo "Docs-only change set (${#CHANGED[@]} path(s))"
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "Code change set (${#NON_DOCS[@]} non-docs path(s))"
            printf '%s\n' "${NON_DOCS[@]}"
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Check
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Lint commits (PR)
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Lint commits (push)
        if: github.event_name == 'push'
        run: |
          if ! git cat-file -e ${{ github.event.before }}^{commit} 2>/dev/null; then
            echo "Base commit not found (new branch or force push) — skipping commitlint"
            exit 0
          fi
          npx commitlint --from ${{ github.event.before }} --to ${{ github.event.after }} --verbose

      - name: GraphQL codegen
        if: needs.changes.outputs.code == 'true'
        run: npm run graphql:generate

      - name: DB codegen
        if: needs.changes.outputs.code == 'true'
        run: npm run db:generate

      - name: Check for uncommitted generated files
        if: needs.changes.outputs.code == 'true'
        run: |
          git diff --exit-code -- '*.gen.ts' '*.generated.ts' 'drizzle/'
          if [ -n "$(git ls-files --others --exclude-standard -- '*.gen.ts' '*.generated.ts' 'drizzle/')" ]; then
            echo "Untracked generated files present — codegen output is not committed"
            exit 1
          fi

      # Docs-only: format + spell still matter; skip types / lint / knip / codegen.
      - name: Format and spell (docs-only)
        if: needs.changes.outputs.code != 'true'
        run: |
          set -uo pipefail
          npm run format:check > /tmp/check-format.log 2>&1 &
          pid_format=$!
          npm run spell:check > /tmp/check-spell.log 2>&1 &
          pid_spell=$!

          set +e
          wait "$pid_format"
          status_format=$?
          wait "$pid_spell"
          status_spell=$?
          set -e

          echo "::group::Format"
          cat /tmp/check-format.log
          echo "::endgroup::"
          echo "::group::Spell"
          cat /tmp/check-spell.log
          echo "::endgroup::"

          failed=0
          [ "$status_format" -eq 0 ] || { echo "Format failed (exit $status_format)"; failed=1; }
          [ "$status_spell" -eq 0 ] || { echo "Spell failed (exit $status_spell)"; failed=1; }
          [ "$failed" -eq 0 ] || exit 1

      # Format / spell / types / usage in parallel, then lint (types before lint, matching
      # local `npm run check`). Fail after printing every parallel log so one broken tool
      # does not hide the others.
      - name: Format, spell, types, usage (parallel), then lint
        if: needs.changes.outputs.code == 'true'
        run: |
          set -uo pipefail
          npm run format:check > /tmp/check-format.log 2>&1 &
          pid_format=$!
          npm run spell:check > /tmp/check-spell.log 2>&1 &
          pid_spell=$!
          npm run type:check > /tmp/check-types.log 2>&1 &
          pid_types=$!
          npm run usage:check > /tmp/check-usage.log 2>&1 &
          pid_usage=$!

          set +e
          wait "$pid_format"
          status_format=$?
          wait "$pid_spell"
          status_spell=$?
          wait "$pid_types"
          status_types=$?
          wait "$pid_usage"
          status_usage=$?
          set -e

          echo "::group::Format"
          cat /tmp/check-format.log
          echo "::endgroup::"
          echo "::group::Spell"
          cat /tmp/check-spell.log
          echo "::endgroup::"
          echo "::group::Types"
          cat /tmp/check-types.log
          echo "::endgroup::"
          echo "::group::Usage"
          cat /tmp/check-usage.log
          echo "::endgroup::"

          failed=0
          [ "$status_format" -eq 0 ] || { echo "Format failed (exit $status_format)"; failed=1; }
          [ "$status_spell" -eq 0 ] || { echo "Spell failed (exit $status_spell)"; failed=1; }
          [ "$status_types" -eq 0 ] || { echo "Types failed (exit $status_types)"; failed=1; }
          [ "$status_usage" -eq 0 ] || { echo "Usage failed (exit $status_usage)"; failed=1; }
          [ "$failed" -eq 0 ] || exit 1

          npm run lint:check

  test:
    name: Test (${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      sessionCookieName: test-session
      WEB_PAGE_URL: http://localhost:3000
      VISITOR_IP_HASH_SALT: test-salt
      AUTH_OTP_PEPPER: test-otp-pepper
      AUTH_TOTP_ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
      SERVER_TOKEN_SECRET: test-server-token-secret
      GOOGLE_GENERATIVE_AI_API_KEY: test-google-generative-ai-key
      GOOGLE_PLACES_API_KEY: test-google-places-key
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      STRIPE_PUBLISHABLE_KEY: pk_test_ci
      RECAPTCHA_SECRET_KEY: test-recaptcha-secret
      RECAPTCHA_SITE_KEY: test-recaptcha-site
      LIVEKIT_URL: wss://livekit.example.com
      LIVEKIT_API_KEY: test-livekit-key
      LIVEKIT_API_SECRET: test-livekit-secret
      OBJECT_STORAGE_S3_BUCKET: test-bucket
      OBJECT_STORAGE_S3_ENDPOINT: https://garage.example.com
      OBJECT_STORAGE_S3_REGION: garage
      OBJECT_STORAGE_S3_ACCESS_KEY_ID: test-access-key
      OBJECT_STORAGE_S3_SECRET_ACCESS_KEY: test-secret-key
      KLAVIYO_PRIVATE_API_KEY: pk_klaviyo_ci
      EMAIL_TRANSPORT: console
      SLACK_TRANSPORT: console
      WHATSAPP_TRANSPORT: console
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: Run migrations
        run: npm run db:push

      - name: Test shard ${{ matrix.shard }}/2
        run: npx vitest run --shard=${{ matrix.shard }}/2

  # Single required check name for branch protection. Succeeds on docs-only; otherwise
  # requires every Vitest shard to pass.
  test-gate:
    name: Test
    needs: [changes, test]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Docs-only — unit tests not required
        if: needs.changes.outputs.code != 'true'
        run: echo "Docs-only change set — skipping unit tests"

      - name: Require Vitest shards
        if: needs.changes.outputs.code == 'true'
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Vitest shards did not succeed (result=${{ needs.test.result }})"
            exit 1
          fi
          echo "All Vitest shards passed"

  e2e:
    name: End to end tests (${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      sessionCookieName: test-session
      WEB_PAGE_URL: http://localhost:3000
      VISITOR_IP_HASH_SALT: test-salt
      AUTH_OTP_PEPPER: test-otp-pepper
      AUTH_TOTP_ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
      SERVER_TOKEN_SECRET: test-server-token-secret
      GOOGLE_GENERATIVE_AI_API_KEY: test-google-generative-ai-key
      GOOGLE_PLACES_API_KEY: test-google-places-key
      # Dual-accept e2e skips when this is the CI placeholder (needs a real test secret).
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY || 'sk_test_ci_placeholder' }}
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY || 'pk_test_ci' }}
      RECAPTCHA_SECRET_KEY: test-recaptcha-secret
      RECAPTCHA_SITE_KEY: test-recaptcha-site
      LIVEKIT_URL: wss://livekit.example.com
      LIVEKIT_API_KEY: test-livekit-key
      LIVEKIT_API_SECRET: test-livekit-secret
      OBJECT_STORAGE_S3_BUCKET: test-bucket
      OBJECT_STORAGE_S3_ENDPOINT: https://garage.example.com
      OBJECT_STORAGE_S3_REGION: garage
      OBJECT_STORAGE_S3_ACCESS_KEY_ID: test-access-key
      OBJECT_STORAGE_S3_SECRET_ACCESS_KEY: test-secret-key
      KLAVIYO_PRIVATE_API_KEY: pk_klaviyo_ci
      EMAIL_TRANSPORT: console
      SLACK_TRANSPORT: console
      WHATSAPP_TRANSPORT: console
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run migrations
        run: npm run db:push

      - name: End to end tests shard ${{ matrix.shard }}/2
        run: npx playwright test --shard=${{ matrix.shard }}/2

  e2e-gate:
    name: End to end tests
    needs: [changes, e2e]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Docs-only — end to end tests not required
        if: needs.changes.outputs.code != 'true'
        run: echo "Docs-only change set — skipping end to end tests"

      - name: Require end to end shards
        if: needs.changes.outputs.code == 'true'
        run: |
          if [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "End to end shards did not succeed (result=${{ needs.e2e.result }})"
            exit 1
          fi
          echo "All end to end shards passed"

  migrations-check:
    name: Migrations applied
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: Check migrations applied (test)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
        run: |
          echo "::group::Migrations — test"
          npm run db:check-applied
          echo "::endgroup::"

      - name: Check migrations applied (prod)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
        run: |
          echo "::group::Migrations — prod"
          npm run db:check-applied
          echo "::endgroup::"

  deploy:
    name: Deploy (${{ github.ref_name == 'main' && 'test' || 'production' }})
    needs: [check, test-gate, e2e-gate, migrations-check]
    # main → test; production → production. test-gate / e2e-gate always run
    # (docs-only succeeds without shards / Playwright).
    if: |
      always()
      && !cancelled()
      && github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production')
      && needs.check.result == 'success'
      && needs.test-gate.result == 'success'
      && needs.e2e-gate.result == 'success'
      && (needs.migrations-check.result == 'success' || needs.migrations-check.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: deploy-${{ github.ref_name == 'main' && 'test' || 'production' }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      # Runtime base (Chromium + allowlisted node_modules) is keyed by lockfile
      # versions via build-args — unrelated dependency bumps stay cache hits.
      # Built every deploy so `:runtime-base` always matches this commit; warm
      # cache makes unchanged allowlist versions a few seconds. See
      # docs/infrastructure.md § Runtime base image.
      - name: Resolve runtime base build-args
        id: runtime_base_args
        run: node scripts/runtimeBaseBuildArgs.mjs gha >> "$GITHUB_OUTPUT"

      - name: Build and push runtime base
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.runtime-base
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:runtime-base
          build-args: |
            NPM_VERSION=${{ steps.runtime_base_args.outputs.NPM_VERSION }}
            PLAYWRIGHT_VERSION=${{ steps.runtime_base_args.outputs.PLAYWRIGHT_VERSION }}
            PG_VERSION=${{ steps.runtime_base_args.outputs.PG_VERSION }}
            OTEL_API_VERSION=${{ steps.runtime_base_args.outputs.OTEL_API_VERSION }}
            OTEL_INSTRUMENTATION_VERSION=${{ steps.runtime_base_args.outputs.OTEL_INSTRUMENTATION_VERSION }}
            OTEL_INSTRUMENTATION_HTTP_VERSION=${{ steps.runtime_base_args.outputs.OTEL_INSTRUMENTATION_HTTP_VERSION }}
            OTEL_INSTRUMENTATION_PG_VERSION=${{ steps.runtime_base_args.outputs.OTEL_INSTRUMENTATION_PG_VERSION }}
          cache-from: |
            type=gha,scope=runtime-base
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:runtime-base-buildcache
          cache-to: |
            type=gha,mode=max,scope=runtime-base
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:runtime-base-buildcache,mode=max

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            RUNTIME_BASE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:runtime-base
          # Layer cache: GHA (scoped so production / feature branches reuse main)
          # plus GHCR registry (survives the ~10 GiB GHA limit). mode=max keeps
          # intermediate multi-stage layers. Chromium lives in `:runtime-base`.
          # See docs/infrastructure.md § Docker build cache.
          cache-from: |
            type=gha,scope=main
            type=gha,scope=${{ github.ref_name }}
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: |
            type=gha,mode=max,scope=${{ github.ref_name }}
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Set image tag on Coolify
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          APP_UUID: ${{ secrets[github.ref_name == 'main' && 'COOLIFY_APPLICATION_UUID_TEST' || 'COOLIFY_APPLICATION_UUID_PROD'] }}
          TAG: ${{ steps.meta.outputs.version }}
        run: |
          set -e
          BODY=$(jq -n --arg tag "$TAG" '{docker_registry_image_tag:$tag}')
          RESP=$(curl -sS -w "\n%{http_code}" -X PATCH \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "${COOLIFY_URL%/}/api/v1/applications/${APP_UUID}")
          BODY_JSON=$(echo "$RESP" | head -n -1); CODE=$(echo "$RESP" | tail -n1)
          echo "PATCH HTTP $CODE"; echo "$BODY_JSON"; test "$CODE" = "200"

      - name: Restart application
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          APP_UUID: ${{ secrets[github.ref_name == 'main' && 'COOLIFY_APPLICATION_UUID_TEST' || 'COOLIFY_APPLICATION_UUID_PROD'] }}
        run: |
          set -e
          RESP=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_URL%/}/api/v1/applications/${APP_UUID}/restart")
          BODY=$(echo "$RESP" | head -n -1); CODE=$(echo "$RESP" | tail -n1)
          echo "RESTART HTTP $CODE"; echo "$BODY"; test "$CODE" = "200"

      - name: Verify deployment
        env:
          WEB_APP_URL: ${{ secrets[github.ref_name == 'main' && 'WEB_APP_URL_TEST' || 'WEB_APP_URL_PROD'] }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -e
          INITIAL_DELAY=30
          ATTEMPTS=60
          INTERVAL=5
          LAST_VERSION=""
          LAST_CODE=""
          echo "Waiting ${INITIAL_DELAY}s for Coolify pull/restart before polling"
          sleep $INITIAL_DELAY
          for i in $(seq 1 $ATTEMPTS); do
            RESP=$(curl -sS -m 5 -w "\n%{http_code}" "${WEB_APP_URL%/}/api/health" || echo $'\n000')
            BODY=$(echo "$RESP" | head -n -1); LAST_CODE=$(echo "$RESP" | tail -n1)
            if [ "$LAST_CODE" = "200" ]; then
              LAST_VERSION=$(echo "$BODY" | jq -r '.version // empty')
              if [ "$LAST_VERSION" = "$EXPECTED_SHA" ]; then
                echo "Verified ${EXPECTED_SHA} is live (attempt ${i})"
                exit 0
              fi
            fi
            echo "Attempt ${i}/${ATTEMPTS}: HTTP ${LAST_CODE}, version='${LAST_VERSION}', expected='${EXPECTED_SHA}'"
            sleep $INTERVAL
          done
          echo "Verification failed after ${ATTEMPTS} attempts. Last HTTP ${LAST_CODE}, last version='${LAST_VERSION}', expected='${EXPECTED_SHA}'"
          exit 1
